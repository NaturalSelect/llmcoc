services:
  llmcoc:
    image: ghcr.io/naturalselect/llmcoc:latest
    build: .
    container_name: llmcoc
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - coc_data:/app/data
    environment:
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}

volumes:
  coc_data:
